[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "universal-agent-cua"
version = "2.3.0"
description = "Универсальный Целостный Агент (ЦУА): один мозг, четыре контура памяти, JSON-протокол воли. Только stdlib."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "rtynbirf" }]
keywords = ["agent", "llm", "autonomous", "holistic", "ollama", "vllm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.scripts]
universal-agent = "universal_agent:main"

[tool.setuptools]
py-modules = ["universal_agent"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
